<svg viewBox="0 0 980 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="220" fill="#ffffff"/>

  <!-- Steps -->
  <g>
    <rect x="10" y="70" width="170" height="80" rx="10" fill="#4F6BFF"/>
    <text x="95" y="102" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">UseAuthentication</text>
    <text x="95" y="120" fill="#dbe2ff" font-size="10.5" text-anchor="middle">picks the scheme</text>
    <text x="95" y="134" fill="#dbe2ff" font-size="10.5" text-anchor="middle">builds ClaimsPrincipal</text>
  </g>

  <line x1="180" y1="110" x2="212" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="215" y="70" width="190" height="80" rx="10" fill="#0EA5A5"/>
    <text x="310" y="96" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">AuthMiddleware</text>
    <text x="310" y="114" fill="#e6fffb" font-size="10.5" text-anchor="middle">gates: skip OPTIONS/OIDC</text>
    <text x="310" y="128" fill="#e6fffb" font-size="10.5" text-anchor="middle">callbacks/anon endpoints,</text>
    <text x="310" y="142" fill="#e6fffb" font-size="10.5" text-anchor="middle">challenge or 401</text>
  </g>

  <line x1="405" y1="110" x2="437" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="440" y="70" width="210" height="80" rx="10" fill="#F59E0B"/>
    <text x="545" y="96" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">UpdateClaimsMiddleware</text>
    <text x="545" y="114" fill="#fff" font-size="10.5" text-anchor="middle">enriches principal via</text>
    <text x="545" y="128" fill="#fff" font-size="10.5" text-anchor="middle">IUserClaimsProvider</text>
    <text x="545" y="142" fill="#fff" font-size="10.5" text-anchor="middle">(roles + permissions)</text>
  </g>

  <line x1="650" y1="110" x2="682" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="685" y="70" width="180" height="80" rx="10" fill="#E1306C"/>
    <text x="775" y="102" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">UseAuthorization</text>
    <text x="775" y="120" fill="#ffe1ec" font-size="10.5" text-anchor="middle">[PermissionAuthorize],</text>
    <text x="775" y="134" fill="#ffe1ec" font-size="10.5" text-anchor="middle">[RoleAuthorize], policies</text>
  </g>

  <line x1="865" y1="110" x2="897" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="900" y="80" width="70" height="60" rx="10" fill="#1f2937"/>
    <text x="935" y="115" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">Endpoint</text>
  </g>

  <text x="490" y="30" font-size="15" text-anchor="middle" font-weight="700" fill="#111">One call — app.UseFronteggAuth() — wires all four steps</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
